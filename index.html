<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bored</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Bungee&family=Bungee+Shade&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="marquee">
    <div class="marquee-board">
      <p class="marquee-kicker">Live from your bedroom</p>
      <h1 class="marquee-title">Bored</h1>
      <p class="marquee-sub">The wheel of something to do</p>
    </div>
  </header>

  <main class="stage">
    <section class="host" aria-live="polite">
      <p class="host-name">Your host, Buddy Marquee</p>
      <p class="host-line" id="hostLine"></p>
    </section>

    <section class="controls">
      <div class="moods" id="moods" role="radiogroup" aria-label="Mood">
        <button class="mood" type="button" role="radio" data-mood="fried">Fried</button>
        <button class="mood" type="button" role="radio" data-mood="meh">Meh</button>
        <button class="mood" type="button" role="radio" data-mood="lockedIn">Locked in</button>
      </div>

      <label class="toggle">
        <input type="checkbox" id="mysteryToggle">
        <span class="toggle-track" aria-hidden="true"></span>
        Mystery mode
      </label>

      <button class="gear" id="settingsButton" type="button" aria-label="Settings" aria-controls="drawer" aria-expanded="false">⚙</button>
    </section>

    <div class="wheel-wrap" id="wheelWrap">
      <div class="bulbs" id="bulbs" aria-hidden="true"></div>
      <canvas class="wheel" id="wheel" aria-label="Activity wheel"></canvas>
      <div class="pointer" id="pointer" aria-hidden="true"></div>
      <div class="hub" aria-hidden="true">★</div>
    </div>

    <button class="spin-button" id="spinButton" type="button">Spin</button>
  </main>

  <div class="result" id="result" hidden>
    <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <p class="result-kicker" id="resultKicker"></p>
      <div class="result-icon" id="resultIcon"></div>
      <p class="result-category" id="resultCategory"></p>
      <h2 class="result-title" id="resultTitle"></h2>
      <p class="result-minutes" id="resultMinutes"></p>
      <div class="result-actions" id="resultActions"></div>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Settings" hidden>
    <header class="drawer-header">
      <h2>Backstage</h2>
      <button class="drawer-close" id="drawerClose" type="button" aria-label="Close settings">✕</button>
    </header>

    <section class="drawer-section">
      <h3>On the wheel</h3>
      <p class="drawer-note">Untick anything you never want to land on.</p>
      <div id="taskToggles"></div>
    </section>

    <section class="drawer-section">
      <h3>History</h3>
      <ol class="history" id="history"></ol>
    </section>
  </aside>

  <script src="tasks.js"></script>
  <script src="sounds.js"></script>
  <script src="app.js"></script>
</body>
</html>
